{% extends "base_app.html" %}
{% block title %}Submission Confirmation · {{ app_short_name }}{% endblock %}
{% block page_heading %}Examination Submission Receipt{% endblock %}

{% block content %}
<div id="confirmation-container" class="receipt-card">
  <div class="card card-body">
    <div class="skeleton" style="height:140px;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:180px;"></div>
  </div>
</div>

<script id="confirmation-page-state" type="application/json">{{ {"submissionId": submission_id} | tojson }}</script>
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/submissionConfirmation.js') }}"></script>
{% endblock %}
