{% extends "base.html" %}
{% block title %}500 Server Error · {{ app_short_name }}{% endblock %}
{% block body %}
<div style="min-height:100vh;display:grid;place-items:center;padding:1.5rem;">
  <div class="card" style="max-width:480px;width:100%;padding:2.2rem;text-align:center;">
    <span class="badge badge-danger mb-4">500 · Server Error</span>
    <h1 style="font-size:1.5rem;">Something Went Wrong</h1>
    <p class="text-secondary mt-2">{{ message or "An unexpected server error occurred. Please try again." }}</p>
    <div class="mt-6">
      <a href="{{ home_url or '/login' }}" class="btn btn-primary">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
